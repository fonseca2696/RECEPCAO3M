<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recepção — 3M Agropecuária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#1a3a2a; --verde2:#2d5a3d; --verde3:#4a7c59; --verde-claro:#e8f0eb;
  --dourado:#b8962e; --dourado2:#d4a843;
  --cinza:#f5f6f5; --cinza2:#e8eae8; --cinza3:#b0b8b4;
  --texto:#1a2420; --texto2:#4a5550; --texto3:#7a8580;
  --branco:#fff; --erro:#c0392b; --sucesso:#27ae60; --aviso:#e67e22;
  --shadow:0 2px 12px rgba(0,0,0,.08); --shadow2:0 4px 24px rgba(0,0,0,.13);
  --radius:12px; --radius2:8px;
}
html,body{height:100%;font-family:'Outfit',system-ui,sans-serif;background:var(--cinza);color:var(--texto);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}

/* ══════════════════════════════════════════
   TOAST / NOTIFICAÇÕES
══════════════════════════════════════════ */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;
  padding:10px 20px;border-radius:24px;font-weight:600;font-size:13px;
  display:none;white-space:nowrap;box-shadow:var(--shadow2)}
#toast.ok{background:var(--sucesso);color:#fff}
#toast.err{background:var(--erro);color:#fff}
#toast.info{background:var(--verde);color:#fff}

/* ══════════════════════════════════════════
   APP LAYOUT
══════════════════════════════════════════ */
#app{display:none;flex-direction:column;height:100vh}

/* TOPBAR */
.topbar{background:var(--verde);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;height:56px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-logo .marca{width:34px;height:34px;background:var(--dourado);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
.topbar-nome{font-weight:700;font-size:15px}
.topbar-sub{font-size:11px;opacity:.7;font-weight:400}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-relogio{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.topbar-data{font-size:11px;opacity:.7;text-align:right}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;position:relative}
.user-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.user-nome{font-size:13px;font-weight:600}
.user-perfil{font-size:10px;opacity:.7}
.user-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border-radius:var(--radius2);
  box-shadow:var(--shadow2);min-width:180px;display:none;z-index:200;overflow:hidden;
  border:1px solid var(--cinza2)}
.user-menu.aberto{display:block}
.user-menu-item{padding:11px 16px;font-size:13px;color:var(--texto);cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:background .15s}
.user-menu-item:hover{background:var(--cinza)}
.user-menu-item.sair{color:var(--erro)}

/* ABAS */
.tabs{background:var(--verde);display:flex;gap:2px;padding:0 16px;flex-shrink:0;
  border-top:1px solid rgba(255,255,255,.1)}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);
  cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab.ativa{color:#fff;border-bottom-color:var(--dourado);font-weight:700}
.tab[hidden]{display:none}

/* CONTEÚDO */
.conteudo{flex:1;overflow-y:auto;padding:20px}

/* ══════════════════════════════════════════
   CARDS E COMPONENTES
══════════════════════════════════════════ */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-titulo{font-size:18px;font-weight:700;color:var(--verde);margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.card-titulo span{font-size:22px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}

/* KPIS */
.kpi{background:#fff;border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);border-left:4px solid var(--verde2)}
.kpi-val{font-size:28px;font-weight:800;color:var(--verde)}
.kpi-label{font-size:12px;color:var(--texto3);margin-top:2px}

/* BOTÕES */
.btn{padding:9px 18px;border-radius:var(--radius2);font-weight:600;font-size:13px;
  border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-verde{background:var(--verde2);color:#fff}
.btn-verde:hover{background:var(--verde)}
.btn-dourado{background:var(--dourado);color:#fff}
.btn-dourado:hover{background:var(--dourado2)}
.btn-outline{background:transparent;border:1.5px solid var(--verde2);color:var(--verde2)}
.btn-outline:hover{background:var(--verde-claro)}
.btn-perigo{background:var(--erro);color:#fff}
.btn-perigo:hover{opacity:.85}
.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* FORM */
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--texto3);margin-bottom:5px;display:block}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--cinza2);
  border-radius:var(--radius2);font-size:14px;color:var(--texto);background:#fff;
  outline:none;transition:border .15s}
.form-input:focus{border-color:var(--verde2)}
.form-input[readonly]{background:var(--cinza);color:var(--texto3)}
textarea.form-input{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-verde{background:#d4edda;color:#155724}
.badge-amarelo{background:#fff3cd;color:#856404}
.badge-vermelho{background:#f8d7da;color:#721c24}
.badge-azul{background:#d1ecf1;color:#0c5460}
.badge-cinza{background:var(--cinza2);color:var(--texto3)}

/* TABELA */
.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--verde);color:#fff;padding:10px 12px;text-align:left;font-weight:600;font-size:12px}
td{padding:10px 12px;border-bottom:1px solid var(--cinza2);vertical-align:middle}
tr:hover td{background:var(--cinza)}
.acoes{display:flex;gap:6px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;
  display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.aberto{display:flex}
.modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow2);
  width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-titulo{font-size:18px;font-weight:700;color:var(--verde);
  margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal-rodape{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--cinza2)}

/* CALENDÁRIO */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cal-titulo-mes{font-size:18px;font-weight:700;color:var(--verde);flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dia-header{text-align:center;font-size:11px;font-weight:700;color:var(--texto3);
  padding:6px 0;text-transform:uppercase}
.cal-dia{min-height:80px;background:#fff;border:1px solid var(--cinza2);
  border-radius:6px;padding:6px;cursor:pointer;transition:background .15s}
.cal-dia:hover{background:var(--verde-claro)}
.cal-dia.outro-mes{background:var(--cinza);opacity:.5}
.cal-dia.hoje{border-color:var(--dourado);border-width:2px}
.cal-dia-num{font-size:13px;font-weight:600;margin-bottom:4px}
.cal-evento{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;
  background:var(--verde2);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-evento.sala2{background:var(--dourado)}
.cal-evento.sala3{background:#2980b9}

/* SALAS */
.salas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.sala-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  border-top:4px solid var(--verde2)}
.sala-nome{font-weight:700;font-size:15px;color:var(--verde);margin-bottom:8px}
.sala-status{font-size:12px;margin-bottom:12px}
.sala-ocupacao{font-size:11px;color:var(--texto3);margin-top:8px}
.sala-prox{font-size:12px;color:var(--texto2);padding:8px;background:var(--cinza);
  border-radius:6px;margin-top:8px}

/* URGÊNCIA */
.urg-alta{color:var(--erro);font-weight:700}
.urg-media{color:var(--aviso);font-weight:600}
.urg-baixa{color:var(--sucesso)}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 20px;color:var(--texto3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-msg{font-size:15px;font-weight:500}
.empty-sub{font-size:13px;margin-top:4px}

/* LOADING */
.loading{text-align:center;padding:32px;color:var(--texto3)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--cinza2);
  border-top-color:var(--verde2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ENTRADA/SAÍDA */
.entrada-tipo{display:flex;gap:8px;margin-bottom:16px}
.tipo-btn{flex:1;padding:10px;border:2px solid var(--cinza2);border-radius:var(--radius2);
  background:#fff;font-weight:600;font-size:13px;color:var(--texto2);cursor:pointer;
  transition:all .2s;text-align:center}
.tipo-btn.ativo{border-color:var(--verde2);background:var(--verde-claro);color:var(--verde)}

/* EMAIL TAGS */
.email-tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px solid var(--cinza2);
  border-radius:var(--radius2);min-height:42px;cursor:text}
.email-tags:focus-within{border-color:var(--verde2)}
.email-tag{background:var(--verde-claro);color:var(--verde);padding:3px 8px;
  border-radius:20px;font-size:12px;display:flex;align-items:center;gap:4px}
.email-tag-rm{cursor:pointer;opacity:.7;font-size:14px;line-height:1}
.email-tag-rm:hover{opacity:1}
.email-input{border:none;outline:none;font-size:13px;flex:1;min-width:120px;font-family:inherit}

/* PREVIEW CONVITE */
.preview-convite{background:var(--cinza);border-radius:var(--radius2);padding:14px;
  font-size:12px;line-height:1.7;color:var(--texto2);margin-top:8px;white-space:pre-wrap}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     TOAST
══════════════════════════════════════════════ -->
<div id="toast"></div>

<!-- ══════════════════════════════════════════════
     APP
══════════════════════════════════════════════ -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="marca">3M</div>
      <div>
        <div class="topbar-nome">3M Agropecuária</div>
        <div class="topbar-sub">Sistema de Recepção</div>
      </div>
    </div>
    <div class="topbar-right">
      <div>
        <div class="topbar-relogio" id="relogio">--:--:--</div>
        <div class="topbar-data" id="data-hoje"></div>
      </div>
      <div class="topbar-user" id="topbar-user" onclick="toggleUserMenu()">
        <div class="user-avatar" id="user-avatar">NA</div>
        <div>
          <div class="user-nome" id="user-nome">Carregando...</div>
          <div class="user-perfil" id="user-perfil"></div>
        </div>
        <div class="user-menu" id="user-menu">
          <div class="user-menu-item" onclick="LC3M_FRONT.trocarSenha()">🔑 Trocar senha</div>
          <div class="user-menu-item sair" onclick="LC3M_FRONT.sair()">← Sair</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ABAS -->
  <div class="tabs" id="tabs">
    <div class="tab" data-aba="inicio" onclick="irAba('inicio')">🏠 Início</div>
    <div class="tab" data-aba="calendario" onclick="irAba('calendario')">📅 Calendário</div>
    <div class="tab" data-aba="salas" onclick="irAba('salas')">📋 Salas</div>
    <div class="tab" data-aba="visitantes" onclick="irAba('visitantes')" id="tab-visitantes">👤 Visitantes</div>
    <div class="tab" data-aba="entradas" onclick="irAba('entradas')" id="tab-entradas">📦 Entrada/Saída</div>
    <div class="tab" data-aba="recados" onclick="irAba('recados')" id="tab-recados">💬 Recados</div>
    <div class="tab" data-aba="log" onclick="irAba('log')" id="tab-log">📋 Log</div>
  </div>

  <!-- CONTEÚDO -->
  <div class="conteudo" id="conteudo"></div>
</div>

<!-- ══════════════════════════════════════════════
     MODAIS
══════════════════════════════════════════════ -->

<!-- Modal: Novo Agendamento -->
<div class="modal-bg" id="modal-agenda">
  <div class="modal">
    <div class="modal-titulo"><span>📅</span> <span id="modal-agenda-titulo">Novo Agendamento</span></div>
    <div class="form-group">
      <label class="form-label">Sala *</label>
      <select class="form-input" id="ag-sala"></select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Data *</label>
        <input type="date" class="form-input" id="ag-data" oninput="atualizarPreviewConvite()">
      </div>
      <div class="form-group">
        <label class="form-label">Início *</label>
        <input type="time" class="form-input" id="ag-inicio" oninput="atualizarPreviewConvite()">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Término</label>
        <input type="time" class="form-input" id="ag-fim">
      </div>
      <div class="form-group">
        <label class="form-label">Responsável / Solicitante *</label>
        <input type="text" class="form-input" id="ag-resp" oninput="atualizarPreviewConvite()">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">E-mails dos Convidados</label>
      <div class="email-tags" id="email-tags-container" onclick="document.getElementById('email-input-field').focus()">
        <input class="email-input" id="email-input-field" type="email" placeholder="email@3m.agr.br e pressione Enter" onkeydown="emailTagKeydown(event)">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Assunto / Pauta</label>
      <textarea class="form-input" id="ag-assunto" rows="2" oninput="atualizarPreviewConvite()"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Preview do Convite</label>
      <div class="preview-convite" id="preview-convite"></div>
    </div>
    <div class="modal-rodape">
      <button class="btn btn-outline" onclick="fecharModal('modal-agenda')">Cancelar</button>
      <button class="btn btn-dourado" id="btn-salvar-agenda" onclick="salvarAgenda()">📅 Agendar + Enviar Convite</button>
    </div>
  </div>
</div>

<!-- Modal: Visitante -->
<div class="modal-bg" id="modal-visitante">
  <div class="modal">
    <div class="modal-titulo"><span>👤</span> <span id="modal-vis-titulo">Novo Visitante</span></div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Nome *</label>
        <input type="text" class="form-input" id="vis-nome">
      </div>
      <div class="form-group">
        <label class="form-label">Empresa</label>
        <input type="text" class="form-input" id="vis-empresa">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Com quem falar</label>
        <input type="text" class="form-input" id="vis-comquem">
      </div>
      <div class="form-group">
        <label class="form-label">Motivo</label>
        <input type="text" class="form-input" id="vis-motivo">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Observações</label>
      <textarea class="form-input" id="vis-obs" rows="2"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Hora de chegada</label>
        <input type="time" class="form-input" id="vis-hora">
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-input" id="vis-status">
          <option value="aguardando">Aguardando</option>
          <option value="em_atendimento">Em atendimento</option>
          <option value="finalizado">Finalizado</option>
        </select>
      </div>
    </div>
    <div class="modal-rodape">
      <button class="btn btn-outline" onclick="fecharModal('modal-visitante')">Cancelar</button>
      <button class="btn btn-verde" onclick="salvarVisitante()">✅ Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Entrada/Saída -->
<div class="modal-bg" id="modal-entrada">
  <div class="modal">
    <div class="modal-titulo"><span>📦</span> Registrar Entrada / Saída</div>
    <div class="entrada-tipo">
      <button class="tipo-btn ativo" id="tipo-entrada" onclick="setTipo('entrada')">📥 Entrada</button>
      <button class="tipo-btn" id="tipo-saida" onclick="setTipo('saida')">📤 Saída</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Nome *</label>
        <input type="text" class="form-input" id="ent-nome">
      </div>
      <div class="form-group">
        <label class="form-label">Setor</label>
        <input type="text" class="form-input" id="ent-setor">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Observações</label>
      <input type="text" class="form-input" id="ent-obs">
    </div>
    <div class="modal-rodape">
      <button class="btn btn-outline" onclick="fecharModal('modal-entrada')">Cancelar</button>
      <button class="btn btn-verde" onclick="salvarEntrada()">✅ Registrar</button>
    </div>
  </div>
</div>

<!-- Modal: Recado -->
<div class="modal-bg" id="modal-recado">
  <div class="modal">
    <div class="modal-titulo"><span>💬</span> <span id="modal-rec-titulo">Novo Recado</span></div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Para *</label>
        <input type="text" class="form-input" id="rec-para">
      </div>
      <div class="form-group">
        <label class="form-label">De (quem ligou/visitou)</label>
        <input type="text" class="form-input" id="rec-de">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Telefone</label>
        <input type="tel" class="form-input" id="rec-tel">
      </div>
      <div class="form-group">
        <label class="form-label">Urgência</label>
        <select class="form-input" id="rec-urg">
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Mensagem *</label>
      <textarea class="form-input" id="rec-msg" rows="3"></textarea>
    </div>
    <div class="modal-rodape">
      <button class="btn btn-outline" onclick="fecharModal('modal-recado')">Cancelar</button>
      <button class="btn btn-verde" onclick="salvarRecado()">✅ Salvar</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     SCRIPTS
══════════════════════════════════════════════ -->
<script>
// ══════════════════════════════════════════════════════════
//  LOGIN CENTRAL 3M — cole o conteúdo de LoginCentral3M_front.js aqui
// ══════════════════════════════════════════════════════════
/* ══════════════════════════════════════════════════════════════════════
   LOGIN CENTRAL 3M — tela de login padrão (front-end) · Versão 1 · 30/10/2026
   ══════════════════════════════════════════════════════════════════════ */
const LC3M_FRONT = (() => {
  const SENHA_PADRAO = '3M@2026';
  let cfg = {}, sess = null, senhaTmp = '', modo = '';
  const $ = id => document.getElementById(id);
  const chave = () => 'lc3m_' + (cfg.sistema || '');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const viaGas = () => !cfg.apiUrl && window.google && google.script && google.script.run;

  function bruto(acao, dados, ms) {
    const corpo = JSON.stringify(Object.assign({ acao }, dados || {}));
    if (viaGas()) return new Promise((ok, falha) => google.script.run.withSuccessHandler(ok)
      .withFailureHandler(e => falha(new Error((e && e.message) || String(e)))).lc3mApi(corpo));
    if (!cfg.apiUrl) return Promise.reject(new Error('Endereço do Apps Script (apiUrl) não configurado.'));
    return fetch(cfg.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: corpo, signal: AbortSignal.timeout(ms || 30000) })
      .catch(e => { throw new Error(e.name === 'TimeoutError' ? 'O servidor demorou demais para responder.' : 'Sem conexão com o servidor (' + e.message + ').'); })
      .then(r => r.text()).then(t => {
        try { return JSON.parse(t); }
        catch (e) { throw new Error(/^\s*</.test(t) ? 'O servidor respondeu com uma página em vez de dados. Confira se a implantação do Apps Script está como "Qualquer pessoa".' : t.slice(0, 200)); }
      });
  }

  function montar() {
    if ($('lc3m-ov')) return;
    const st = document.createElement('style');
    st.textContent = `#lc3m-ov{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:16px;background:#f4f7fc;font-family:'Outfit',system-ui,sans-serif}
#lc3m-ov *{box-sizing:border-box}.lc3m-c{width:100%;max-width:440px;background:#fff;border:1px solid #dce4f0;border-radius:18px;padding:32px 30px;box-shadow:0 6px 28px rgba(27,58,107,.13);position:relative;overflow:hidden}
.lc3m-c:before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(135deg,#1B3A6B,#1565C0 50%,#2E7D32)}
.lc3m-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}.lc3m-h img{width:54px;height:54px;object-fit:contain;border-radius:10px;border:1px solid #dce4f0}
.lc3m-t1{font-size:19px;font-weight:800;color:#1B3A6B}.lc3m-t2{font-size:11px;color:#6b88b0;margin-top:2px}
.lc3m-d{font-size:13px;color:#2d4470;line-height:1.55;margin-bottom:16px}.lc3m-l{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#6b88b0;margin-bottom:5px}
.lc3m-i{width:100%;background:#f4f7fc;border:1.5px solid #dce4f0;border-radius:8px;padding:11px 13px;font-size:14px;color:#0f1d35;outline:none;margin-bottom:12px;font-family:inherit}.lc3m-i:focus{border-color:#1B3A6B;background:#fff}
.lc3m-b{width:100%;padding:13px;border:none;cursor:pointer;background:linear-gradient(135deg,#1B3A6B,#1565C0 50%,#2E7D32);color:#fff;border-radius:8px;font-weight:700;font-size:14px;font-family:inherit}.lc3m-b:disabled{opacity:.6;cursor:wait}
.lc3m-v{margin-top:10px;background:none;border:1px solid #c4d2e8;border-radius:20px;padding:7px 14px;font-size:12px;color:#2d4470;cursor:pointer;font-family:inherit}
.lc3m-m{display:none;margin-top:12px;border-radius:8px;padding:10px 13px;font-size:12.5px;line-height:1.5;background:#fce8e8;color:#c62828;border:1px solid #ef9a9a}
.lc3m-g{margin-top:14px;background:#e8eef8;border-radius:8px;padding:11px 13px;font-size:11.5px;color:#2d4470;line-height:1.6}
.lc3m-r{font-size:10px;color:#6b88b0;text-align:center;margin-top:12px}`;
    document.head.appendChild(st);
    const ov = document.createElement('div'); ov.id = 'lc3m-ov';
    ov.innerHTML = `<div class="lc3m-c"><div class="lc3m-h">${cfg.logo ? `<img src="${esc(cfg.logo)}" alt="">` : ''}<div><div class="lc3m-t1">${esc(cfg.titulo || cfg.sistema)}</div><div class="lc3m-t2">3M Agropecuária · login central</div></div></div>
<div id="lc3m-e1"><div class="lc3m-d">Entre com o mesmo usuário e senha dos sistemas 3M.</div>
<div class="lc3m-l">Usuário</div><input class="lc3m-i" id="lc3m-u" autocomplete="username" placeholder="usuário ou e-mail @3m.agr.br">
<div class="lc3m-l">Senha</div><input class="lc3m-i" id="lc3m-s" type="password" autocomplete="current-password">
<button class="lc3m-b" id="lc3m-bt">Entrar</button>
<div class="lc3m-g">Primeiro acesso? Use a senha padrão que você recebeu — o sistema vai pedir para criar uma senha sua.<br>Esqueceu a senha? Fale com a administradora (natalia@3m.agr.br).</div></div>
<div id="lc3m-e2" style="display:none"><div class="lc3m-t1" id="lc3m-tt" style="font-size:16px;margin-bottom:6px"></div><div class="lc3m-d" id="lc3m-td"></div>
<div id="lc3m-ab"><div class="lc3m-l">Senha atual</div><input class="lc3m-i" id="lc3m-a" type="password" autocomplete="current-password"></div>
<div class="lc3m-l">Nova senha</div><input class="lc3m-i" id="lc3m-n" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres">
<div class="lc3m-l">Confirme a nova senha</div><input class="lc3m-i" id="lc3m-cf" type="password" autocomplete="new-password">
<button class="lc3m-b" id="lc3m-bt2">Salvar nova senha</button><button class="lc3m-v" id="lc3m-vt" style="display:none">← Voltar</button></div>
<div class="lc3m-m" id="lc3m-msg"></div><div class="lc3m-r">Login central 3M · mesma senha em todos os sistemas</div></div>`;
    document.body.appendChild(ov);
    $('lc3m-bt').onclick = entrar; $('lc3m-bt2').onclick = salvarSenha; $('lc3m-vt').onclick = voltar;
    $('lc3m-u').onkeydown = e => { if (e.key === 'Enter') $('lc3m-s').focus(); };
    $('lc3m-s').onkeydown = e => { if (e.key === 'Enter') entrar(); };
    $('lc3m-cf').onkeydown = e => { if (e.key === 'Enter') salvarSenha(); };
  }
  const msg = t => { const m = $('lc3m-msg'); m.textContent = t || ''; m.style.display = t ? 'block' : 'none'; };
  const mostrar = on => { $('lc3m-ov').style.display = on ? 'flex' : 'none'; };
  function etapa(n) {
    $('lc3m-e1').style.display = n === 1 ? 'block' : 'none'; $('lc3m-e2').style.display = n === 2 ? 'block' : 'none';
    const vol = modo === 'voluntario';
    $('lc3m-ab').style.display = vol ? 'block' : 'none'; $('lc3m-vt').style.display = vol ? 'inline-block' : 'none';
    $('lc3m-tt').textContent = vol ? 'Trocar senha' : 'Primeiro acesso: crie sua senha';
    $('lc3m-td').textContent = vol ? 'Digite sua senha atual e a nova senha. Ela vale para todos os sistemas 3M.'
      : 'Olá, ' + ((sess && sess.nome || '').split(' ')[0]) + '! Troque a senha padrão por uma senha só sua. Ela vale para todos os sistemas 3M.';
  }
  const salvar = () => { try { localStorage.setItem(chave(), JSON.stringify(sess)); } catch (e) { } };
  function lerSalva() {
    try { const s = JSON.parse(localStorage.getItem(chave()) || 'null'); if (s && s.token && s.expira > Date.now() + 60000 && !s.primeiroAcesso) return s; } catch (e) { }
    return null;
  }
  function telaLogin(texto) {
    mostrar(true); modo = ''; etapa(1); msg(texto || '');
    try { const u = localStorage.getItem('lc3m_ultimo_usuario'); if (u && !$('lc3m-u').value) $('lc3m-u').value = u; } catch (e) { }
    setTimeout(() => $($('lc3m-u').value ? 'lc3m-s' : 'lc3m-u').focus(), 50);
  }
  function abrir() { mostrar(false); if (cfg.aoEntrar) cfg.aoEntrar(Object.assign({}, sess)); }

  async function entrar() {
    const u = $('lc3m-u').value.trim(), s = $('lc3m-s').value;
    if (!u || !s) { msg('Informe usuário e senha.'); return; }
    const b = $('lc3m-bt'); b.disabled = true; b.textContent = 'Entrando…'; msg('');
    try {
      const j = await bruto('login', { usuario: u, senha: s });
      if (!j.ok) { msg(j.erro || 'Não foi possível entrar.'); return; }
      sess = { token: j.token, usuario: j.usuario, nome: j.nome, perfil: j.perfil, expira: j.expira, primeiroAcesso: j.primeiroAcesso };
      try { localStorage.setItem('lc3m_ultimo_usuario', u); } catch (e) { }
      $('lc3m-s').value = '';
      if (j.primeiroAcesso) { senhaTmp = s; modo = 'primeiro'; etapa(2); $('lc3m-n').focus(); }
      else { salvar(); abrir(); }
    } catch (e) { msg(e.message); }
    finally { b.disabled = false; b.textContent = 'Entrar'; }
  }
  async function salvarSenha() {
    const nova = $('lc3m-n').value, conf = $('lc3m-cf').value, atual = modo === 'primeiro' ? senhaTmp : $('lc3m-a').value;
    if (modo === 'voluntario' && !atual) { msg('Digite sua senha atual.'); return; }
    if (nova.length < 6) { msg('A nova senha precisa ter pelo menos 6 caracteres.'); return; }
    if (nova === SENHA_PADRAO) { msg('A nova senha não pode ser a senha padrão.'); return; }
    if (nova !== conf) { msg('A confirmação não é igual à nova senha.'); return; }
    const b = $('lc3m-bt2'); b.disabled = true; b.textContent = 'Salvando…'; msg('');
    try {
      const j = await bruto('trocarSenha', { token: sess && sess.token, senhaAtual: atual, novaSenha: nova });
      if (!j.ok) { if (j.erro === 'SESSAO') { expirou(); return; } msg(j.erro); return; }
      senhaTmp = ''; ['lc3m-n', 'lc3m-cf', 'lc3m-a'].forEach(i => $(i).value = '');
      sess.primeiroAcesso = false; salvar();
      const era = modo; modo = ''; etapa(1);
      if (era === 'primeiro') abrir(); else { mostrar(false); alertar('Senha alterada com sucesso.'); }
    } catch (e) { msg(e.message); }
    finally { b.disabled = false; b.textContent = 'Salvar nova senha'; }
  }
  function voltar() { modo = ''; etapa(1); msg(''); mostrar(false); }
  function alertar(t) {
    let a = $('lc3m-toast');
    if (!a) { a = document.createElement('div'); a.id = 'lc3m-toast'; a.style.cssText = 'position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#2E7D32;color:#fff;padding:10px 18px;border-radius:24px;font:600 13px system-ui;z-index:100000;display:none'; document.body.appendChild(a); }
    a.textContent = t; a.style.display = 'block'; clearTimeout(a._t); a._t = setTimeout(() => a.style.display = 'none', 3500);
  }
  function expirou() {
    sess = null; try { localStorage.removeItem(chave()); } catch (e) { }
    if (cfg.aoSair) cfg.aoSair();
    telaLogin('Sua sessão expirou. Entre de novo.');
  }

  return {
    iniciar(opcoes) {
      cfg = opcoes || {};
      const go = () => { montar(); sess = lerSalva(); if (sess) abrir(); else telaLogin(''); };
      if (document.body) go(); else document.addEventListener('DOMContentLoaded', go);
    },
    sessao: () => sess ? Object.assign({}, sess) : null,
    token: () => sess ? sess.token : null,
    async chamar(acao, dados, ms) {
      const j = await bruto(acao, Object.assign({}, dados || {}, { token: sess && sess.token }), ms);
      if (j && j.erro === 'SESSAO') { expirou(); throw new Error('Sessão expirada.'); }
      if (j && j.erro === 'TROCAR_SENHA') { modo = 'primeiro'; senhaTmp = SENHA_PADRAO; mostrar(true); etapa(2); throw new Error('Troque a senha para continuar.'); }
      return j;
    },
    trocarSenha() { modo = 'voluntario'; msg(''); mostrar(true); etapa(2); $('lc3m-a').focus(); },
    sair() {
      const t = sess && sess.token; if (t) bruto('sair', { token: t }).catch(() => { });
      sess = null; try { localStorage.removeItem(chave()); } catch (e) { }
      if (cfg.aoSair) cfg.aoSair();
      telaLogin('');
    },
    expirou
  };
})();
</script>

<script>
// ══════════════════════════════════════════════════════════
//  CONFIGURAÇÃO
// ══════════════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwXfzo5fNnDZiUPqzD4vUI8gcZGYyB7B8Oxer8-q16CuNFVuisiTnahgcJrvLPV_Uv7/exec';

const SALAS = [
  'Sala de Reunião','Diretoria','RH','Supervisor RH',
  'Gerente Financeiro','Gerente Jurídico','Gerente de Suprimentos','Supervisor Financeiro'
];

// Cores por sala para o calendário
const SALA_CORES = [
  '#2d5a3d','#b8962e','#2980b9','#8e44ad',
  '#c0392b','#16a085','#e67e22','#2c3e50'
];

// ══════════════════════════════════════════════════════════
//  ESTADO GLOBAL
// ══════════════════════════════════════════════════════════
let sessaoAtual = null;
let db = { agenda:[], visitantes:[], entradas:[], recados:[], log:[] };
let abaAtiva = 'calendario';
let calMes = new Date().getMonth();
let calAno = new Date().getFullYear();
let agEditandoId = null;
let visEditandoId = null;
let recEditandoId = null;
let emailTags = [];
let entradaTipo = 'entrada';

// ══════════════════════════════════════════════════════════
//  API
// ══════════════════════════════════════════════════════════
async function api(acao, dados) {
  return LC3M_FRONT.chamar(acao, dados);
}

async function getAll(aba) {
  const r = await api('getAll', { aba });
  if (r && r.ok && r.data) return r.data;
  return [];
}

async function upsert(aba, row) {
  return api('upsert', { aba, row });
}

async function del(aba, id) {
  return api('delete', { aba, id });
}

async function logAcao(acao2, detalhe) {
  try { await api('logAcao', { acao2, detalhe }); } catch(e) {}
}

// ══════════════════════════════════════════════════════════
//  INICIALIZAÇÃO
// ══════════════════════════════════════════════════════════
LC3M_FRONT.iniciar({
  sistema: 'Recepção',
  titulo:  'Sistema de Recepção',
  apiUrl:  SCRIPT_URL,
  aoEntrar: async (s) => {
    sessaoAtual = s;
    document.getElementById('app').style.display = 'flex';
    configurarPerfil(s);
    iniciarRelogio();
    await carregarTodos();
    irAba('calendario');
  },
  aoSair: () => {
    document.getElementById('app').style.display = 'none';
    sessaoAtual = null;
  }
});

function configurarPerfil(s) {
  // Avatar
  const av = document.getElementById('user-avatar');
  const iniciais = (s.nome || 'US').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  av.textContent = iniciais;
  av.style.background = corPorPerfil(s.perfil);
  document.getElementById('user-nome').textContent = s.nome;
  document.getElementById('user-perfil').textContent = s.perfil;

  // Visibilidade das abas
  const p = (s.perfil || '').toLowerCase();
  const isAdmin = p === 'administrador';
  const isLancador = p === 'lançador' || p === 'lancador';
  const isDiretoria = p === 'diretoria';
  const podeVer = isAdmin || isLancador || isDiretoria;

  document.getElementById('tab-visitantes').hidden = !podeVer;
  document.getElementById('tab-entradas').hidden = !podeVer;
  document.getElementById('tab-recados').hidden = !podeVer;
  document.getElementById('tab-log').hidden = !isAdmin;
}

function corPorPerfil(perfil) {
  const p = (perfil||'').toLowerCase();
  if (p === 'administrador') return '#2d5a3d';
  if (p === 'diretoria') return '#b8962e';
  if (p.includes('lançador') || p.includes('lancador')) return '#2980b9';
  return '#7f8c8d';
}

async function carregarTodos() {
  try {
    const p = (sessaoAtual?.perfil||'').toLowerCase();
    const podeVer = p === 'administrador' || p.includes('lançador') || p.includes('lancador') || p === 'diretoria';

    const promises = [getAll('AGENDA')];
    if (podeVer) {
      promises.push(getAll('VISITANTES'));
      promises.push(getAll('ENTRADAS'));
      promises.push(getAll('RECADOS'));
    }
    if (p === 'administrador') promises.push(getAll('LOG'));

    const results = await Promise.all(promises);
    db.agenda = results[0] || [];
    let idx = 1;
    if (podeVer) {
      db.visitantes = results[idx++] || [];
      db.entradas   = results[idx++] || [];
      db.recados    = results[idx++] || [];
    }
    if (p === 'administrador') db.log = results[idx] || [];
  } catch(e) {
    toast('Erro ao carregar dados: '+e.message, 'err');
  }
}

// ══════════════════════════════════════════════════════════
//  RELÓGIO
// ══════════════════════════════════════════════════════════
function iniciarRelogio() {
  function tick() {
    const now = new Date();
    document.getElementById('relogio').textContent = now.toLocaleTimeString('pt-BR');
    document.getElementById('data-hoje').textContent = now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  }
  tick(); setInterval(tick, 1000);
}

// ══════════════════════════════════════════════════════════
//  NAVEGAÇÃO
// ══════════════════════════════════════════════════════════
function irAba(aba) {
  abaAtiva = aba;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('ativa', t.dataset.aba === aba));
  const c = document.getElementById('conteudo');
  switch(aba) {
    case 'inicio':     c.innerHTML = renderInicio(); break;
    case 'calendario': c.innerHTML = renderCalendario(); break;
    case 'salas':      c.innerHTML = renderSalas(); break;
    case 'visitantes': c.innerHTML = renderVisitantes(); break;
    case 'entradas':   c.innerHTML = renderEntradas(); break;
    case 'recados':    c.innerHTML = renderRecados(); break;
    case 'log':        c.innerHTML = renderLog(); break;
  }
}

// ══════════════════════════════════════════════════════════
//  INÍCIO
// ══════════════════════════════════════════════════════════
function renderInicio() {
  const hoje = new Date().toISOString().slice(0,10);
  const agHoje = db.agenda.filter(a => a.data === hoje || (a.data && String(a.data).startsWith(hoje)));
  const visHoje = db.visitantes.filter(v => v.hora && String(v.hora).startsWith(hoje.slice(0,10)));
  const recNaoLidos = db.recados.filter(r => !r.lido).length;
  const entHoje = db.entradas.filter(e => e.entrada && String(e.entrada).startsWith(hoje));

  return `
  <div style="max-width:900px;margin:0 auto">
    <div class="grid3" style="margin-bottom:20px">
      <div class="kpi"><div class="kpi-val">${agHoje.length}</div><div class="kpi-label">Reuniões hoje</div></div>
      <div class="kpi" style="border-left-color:var(--dourado)"><div class="kpi-val" style="color:var(--dourado)">${visHoje.length}</div><div class="kpi-label">Visitantes hoje</div></div>
      <div class="kpi" style="border-left-color:${recNaoLidos>0?'var(--erro)':'var(--sucesso)'}">
        <div class="kpi-val" style="color:${recNaoLidos>0?'var(--erro)':'var(--sucesso)'}">${recNaoLidos}</div>
        <div class="kpi-label">Recados não lidos</div>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-titulo"><span>📅</span> Próximas reuniões hoje</div>
        ${agHoje.length === 0 ? '<div class="empty"><div class="empty-icon">📅</div><div class="empty-msg">Nenhuma reunião hoje</div></div>' :
          agHoje.slice(0,5).map(a => `
            <div style="padding:10px 0;border-bottom:1px solid var(--cinza2)">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <strong>${a.sala}</strong>
                <span class="badge badge-verde">${a.inicio}${a.fim?' – '+a.fim:''}</span>
              </div>
              <div style="font-size:12px;color:var(--texto3);margin-top:3px">${a.assunto||'Sem assunto'} · ${a.responsavel}</div>
            </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-titulo"><span>💬</span> Recados pendentes</div>
        ${db.recados.filter(r=>!r.lido).length === 0 ?
          '<div class="empty"><div class="empty-icon">✅</div><div class="empty-msg">Nenhum recado pendente</div></div>' :
          db.recados.filter(r=>!r.lido).slice(0,5).map(r => `
            <div style="padding:10px 0;border-bottom:1px solid var(--cinza2)">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <strong>Para: ${r.para}</strong>
                <span class="badge ${r.urgencia==='alta'?'badge-vermelho':r.urgencia==='media'?'badge-amarelo':'badge-verde'}">${r.urgencia||'baixa'}</span>
              </div>
              <div style="font-size:12px;color:var(--texto3);margin-top:3px">${r.de||'—'}: ${(r.msg||'').slice(0,60)}</div>
            </div>`).join('')}
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════
//  CALENDÁRIO
// ══════════════════════════════════════════════════════════
function renderCalendario() {
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const hoje = new Date();
  const primeiroDia = new Date(calAno, calMes, 1);
  const ultimoDia  = new Date(calAno, calMes+1, 0);
  const inicioGrid = new Date(primeiroDia); inicioGrid.setDate(1 - primeiroDia.getDay());

  let diasHtml = '';
  const d = new Date(inicioGrid);
  for (let i=0; i<42; i++) {
    const ds = d.toISOString().slice(0,10);
    const outroMes = d.getMonth() !== calMes;
    const ehHoje = ds === hoje.toISOString().slice(0,10);
    const evs = db.agenda.filter(a => {
      const ada = a.data ? String(a.data).slice(0,10) : '';
      return ada === ds;
    });
    const evsHtml = evs.slice(0,3).map((a,idx) => {
      const cor = SALA_CORES[SALAS.indexOf(a.sala) % SALA_CORES.length] || '#2d5a3d';
      return `<div class="cal-evento" style="background:${cor}" title="${a.sala}: ${a.assunto||''}">${a.inicio||''} ${a.sala}</div>`;
    }).join('');
    diasHtml += `<div class="cal-dia${outroMes?' outro-mes':''}${ehHoje?' hoje':''}" onclick="abrirModalAgenda('${ds}')">
      <div class="cal-dia-num">${d.getDate()}</div>${evsHtml}
    </div>`;
    d.setDate(d.getDate()+1);
  }

  const canEdit = podeEditar();
  return `
  <div style="max-width:960px;margin:0 auto">
    <div class="card">
      <div class="cal-nav">
        <button class="btn btn-outline btn-sm" onclick="mudarMes(-1)">‹</button>
        <div class="cal-titulo-mes">${meses[calMes]} ${calAno}</div>
        <button class="btn btn-outline btn-sm" onclick="mudarMes(1)">›</button>
        ${canEdit ? `<button class="btn btn-dourado btn-sm" onclick="abrirModalAgenda()">+ Novo Agendamento</button>` : ''}
      </div>
      <div class="cal-grid">
        ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-dia-header">${d}</div>`).join('')}
        ${diasHtml}
      </div>
    </div>
    <div class="card">
      <div class="card-titulo"><span>📋</span> Agendamentos do mês</div>
      ${renderListaAgenda()}
    </div>
  </div>`;
}

function renderListaAgenda() {
  const agMes = db.agenda.filter(a => {
    if (!a.data) return false;
    const d = new Date(String(a.data).slice(0,10)+'T00:00:00');
    return d.getMonth() === calMes && d.getFullYear() === calAno;
  }).sort((a,b) => (a.data+a.inicio) > (b.data+b.inicio) ? 1 : -1);

  if (!agMes.length) return '<div class="empty"><div class="empty-icon">📅</div><div class="empty-msg">Nenhum agendamento neste mês</div></div>';

  const canEdit = podeEditar();
  return `<div class="tabela-wrap"><table>
    <tr><th>Data</th><th>Horário</th><th>Sala</th><th>Assunto</th><th>Responsável</th>${canEdit?'<th>Ações</th>':''}</tr>
    ${agMes.map(a => `
    <tr>
      <td>${fmtData(a.data)}</td>
      <td>${a.inicio||''}${a.fim?' – '+a.fim:''}</td>
      <td><strong>${a.sala}</strong></td>
      <td>${a.assunto||'—'}</td>
      <td>${a.responsavel||'—'}</td>
      ${canEdit ? `<td><div class="acoes">
        <button class="btn btn-outline btn-sm" onclick="editarAgenda('${a.id}')">✏️</button>
        <button class="btn btn-perigo btn-sm" onclick="excluirAgenda('${a.id}')">🗑️</button>
      </div></td>` : ''}
    </tr>`).join('')}
  </table></div>`;
}

function mudarMes(d) {
  calMes += d;
  if (calMes < 0) { calMes = 11; calAno--; }
  if (calMes > 11) { calMes = 0; calAno++; }
  irAba('calendario');
}

function renderSalas() {

      (a.inicio||'00:00') <= agora && (a.fim||'23:59') >= agora &&
      a.sala === sala

      String(a.data).slice(0,10) === hoje && (a.inicio||'00:00') > agora && a.sala === sala

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">

async function salvarAgenda() {
  const sala   = document.getElementById('ag-sala').value;
  const data   = document.getElementById('ag-data').value;
  const inicio = document.getElementById('ag-inicio').value;
  const fim    = document.getElementById('ag-fim').value;
  const resp   = document.getElementById('ag-resp').value.trim();
  const assunto= document.getElementById('ag-assunto').value.trim();
  if (!sala || !data || !inicio || !resp) { toast('Preencha sala, data, início e responsável','err'); return; }

  // Verificar conflito local
  const conflito = db.agenda.find(a =>
    a.id !== agEditandoId &&
    String(a.data).slice(0,10) === data &&
    a.sala === sala &&
    !(fim && a.inicio >= fim || (a.fim && a.fim <= inicio))
  );
  if (conflito) { toast(`Conflito: ${sala} já está reservada das ${conflito.inicio} às ${conflito.fim||'?'}`, 'err'); return; }

  const id = agEditandoId || 'ag_' + Date.now();
  const row = { id, sala, data, inicio, fim, responsavel:resp, assunto,
    emailsConvidados: emailTags, status:'confirmado',
    criadoPorNome: sessaoAtual?.nome||'', criado: new Date().toISOString() };

  const btn = document.getElementById('btn-salvar-agenda');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    // 1. Salvar na planilha
    await upsert('AGENDA', row);

    // 2. Criar/atualizar evento no Google Calendar + enviar e-mails
    // (só cria evento novo; edições não recriamos o evento para não duplicar)
    if (!agEditandoId) {
      try {
        const r = await api('agendarEvento', {
          sala, data, inicio, fim, responsavel: resp, assunto,
          emailsConvidados: emailTags
        });
        if (r && r.data && r.data.eventId) {
          row.eventId = r.data.eventId;
          // Atualiza a linha na planilha com o eventId para poder excluir depois
          await upsert('AGENDA', row);
        }
      } catch(ex) {
        // Não bloqueia o salvamento se o Calendar falhar
        console.warn('Calendar/e-mail:', ex.message);
        toast('Salvo na planilha, mas houve erro no Calendar: ' + ex.message, 'info');
      }
    }

    if (agEditandoId) {
      db.agenda = db.agenda.map(a => a.id===agEditandoId ? row : a);
    } else {
      db.agenda.push(row);
    }
    await logAcao(agEditandoId ? 'Editou agendamento' : 'Criou agendamento', `${sala} – ${data} ${inicio}`);
    fecharModal('modal-agenda');
    toast(agEditandoId ? 'Agendamento atualizado ✅' : 'Agendamento criado + convites enviados ✅', 'ok');
    irAba(abaAtiva);
  } catch(e) {
    toast('Erro ao salvar: '+e.message, 'err');
  }
  btn.disabled = false; btn.textContent = '📅 Agendar + Enviar Convite';
}

async function excluirAgenda(id) {
  if (!confirm('Excluir este agendamento?')) return;
  try {
    const ag = db.agenda.find(a=>a.id===id);
    await del('AGENDA', id);
    // Remover do Google Calendar se tiver eventId
    if (ag && ag.eventId) {
      try { await api('excluirEvento', { eventId: ag.eventId }); } catch(ex) { console.warn('Calendar delete:', ex.message); }
    }
    db.agenda = db.agenda.filter(a=>a.id!==id);
    await logAcao('Excluiu agendamento', id);
    toast('Agendamento excluído','ok'); irAba(abaAtiva);
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

// Preview do convite
function atualizarPreviewConvite() {
  const data   = document.getElementById('ag-data').value;
  const inicio = document.getElementById('ag-inicio').value;
  const resp   = document.getElementById('ag-resp').value.trim();
  const assunto= document.getElementById('ag-assunto').value.trim();
  const sala   = document.getElementById('ag-sala')?.value || '';
  const nomeConv = emailTags[0] ? emailTags[0].split('@')[0] : 'Convidado(s)';

  let saud = 'Prezado(a)';
  if (inicio) {
    const h = parseInt(inicio.split(':')[0]);
    if (h >= 5 && h < 12) saud = 'Bom dia,';
    else if (h >= 12 && h < 18) saud = 'Boa tarde,';
    else saud = 'Boa noite,';
  }

  const dataFmt = data ? new Date(data+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}) : '—';

  const preview = `${saud} ${nomeConv},

Você foi convidado(a) para uma reunião agendada pela Recepção da 3M Agropecuária.

📍 Local: ${sala || '—'}
📅 Data: ${dataFmt}
⏰ Horário: ${inicio||'—'}${document.getElementById('ag-fim').value ? ' às '+document.getElementById('ag-fim').value : ''}
👤 Responsável: ${resp||'—'}
${assunto ? `📋 Pauta: ${assunto}` : ''}

Em caso de dúvidas, entre em contato com a recepção.

Atenciosamente,
Recepção — 3M Agropecuária`;
  document.getElementById('preview-convite').textContent = preview;
}

// ══════════════════════════════════════════════════════════
function emailTagKeydown(e) {
  if (['Enter',',',' '].includes(e.key)) {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/,'');
    if (val && val.includes('@')) {
      emailTags.push(val);
      e.target.value = '';
      renderEmailTags();
      atualizarPreviewConvite();
    }
  } else if (e.key === 'Backspace' && !e.target.value && emailTags.length) {
    emailTags.pop();
    renderEmailTags();
    atualizarPreviewConvite();
  }
}

function renderEmailTags() {
  const cont = document.getElementById('email-tags-container');
  if (!cont) return;
  const inp = document.getElementById('email-input-field');
  cont.innerHTML = '';
  emailTags.forEach((email, idx) => {
    const tag = document.createElement('div');
    tag.className = 'email-tag';
    tag.innerHTML = `${email}<span class="email-tag-rm" onclick="removeEmailTag(${idx})">×</span>`;
    cont.appendChild(tag);
  });
  cont.appendChild(inp);
}

function removeEmailTag(idx) {
  emailTags.splice(idx,1);
  renderEmailTags();
}

async function salvarVisitante() {
  const nome = document.getElementById('vis-nome').value.trim();
  if (!nome) { toast('Informe o nome','err'); return; }
  const id = visEditandoId || 'vis_'+Date.now();
  const row = { id, nome,

    comquem: document.getElementById('vis-comquem').value.trim(),

  try {
    await upsert('VISITANTES', row);
    if (visEditandoId) db.visitantes = db.visitantes.map(v=>v.id===visEditandoId?row:v);
    else db.visitantes.push(row);
    await logAcao(visEditandoId?'Editou visitante':'Registrou visitante', nome);
    fecharModal('modal-visitante');
    toast('Visitante salvo ✅','ok'); irAba('visitantes');
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

async function excluirVisitante(id) {
  if (!confirm('Excluir este visitante?')) return;
  try {
    await del('VISITANTES', id);
    db.visitantes = db.visitantes.filter(v=>v.id!==id);
    await logAcao('Excluiu visitante', id);
    toast('Visitante excluído','ok'); irAba('visitantes');
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

// ══════════════════════════════════════════════════════════
//  MODAL: ENTRADA/SAÍDA
// ══════════════════════════════════════════════════════════
function abrirModalEntrada() {
  ['ent-nome','ent-setor','ent-obs'].forEach(id=>document.getElementById(id).value='');
  setTipo('entrada');
  abrirModal('modal-entrada');
}

function setTipo(t) {
  entradaTipo = t;
  document.getElementById('tipo-entrada').classList.toggle('ativo', t==='entrada');
  document.getElementById('tipo-saida').classList.toggle('ativo', t==='saida');
}

async function salvarEntrada() {
  const nome = document.getElementById('ent-nome').value.trim();
  if (!nome) { toast('Informe o nome','err'); return; }
  const id = 'ent_'+Date.now();
  const row = { id, nome, tipo:entradaTipo,
    setor: document.getElementById('ent-setor').value.trim(),
    obs:   document.getElementById('ent-obs').value.trim(),
    entrada: entradaTipo==='entrada' ? new Date().toISOString() : '',
    saida:   entradaTipo==='saida'   ? new Date().toISOString() : '',
    criadoPorNome: sessaoAtual?.nome||'' };
  try {
    await upsert('ENTRADAS', row);
    db.entradas.push(row);
    await logAcao('Registrou '+entradaTipo, nome);
    fecharModal('modal-entrada');
    toast('Registrado ✅','ok'); irAba('entradas');
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

async function registrarSaida(id) {
  const ent = db.entradas.find(e=>e.id===id);
  if (!ent) return;
  const row = {...ent, saida: new Date().toISOString()};
  try {
    await upsert('ENTRADAS', row);
    db.entradas = db.entradas.map(e=>e.id===id?row:e);
    await logAcao('Registrou saída', ent.nome);
    toast('Saída registrada ✅','ok'); irAba('entradas');
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

async function excluirEntrada(id) {
  if (!confirm('Excluir este registro?')) return;
  try {
    await del('ENTRADAS', id);
    db.entradas = db.entradas.filter(e=>e.id!==id);
    toast('Excluído','ok'); irAba('entradas');
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

// ══════════════════════════════════════════════════════════
//  MODAL: RECADO
// ══════════════════════════════════════════════════════════
function abrirModalRecado() {
  recEditandoId = null;
  document.getElementById('modal-rec-titulo').textContent = 'Novo Recado';
  ['rec-para','rec-de','rec-tel','rec-msg'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('rec-urg').value='baixa';
  abrirModal('modal-recado');
}

async function salvarRecado() {
  const para = document.getElementById('rec-para').value.trim();
  const msg  = document.getElementById('rec-msg').value.trim();
  if (!para || !msg) { toast('Preencha "para" e "mensagem"','err'); return; }
  const id = recEditandoId || 'rec_'+Date.now();
  const row = { id, para, msg,
    de:  document.getElementById('rec-de').value.trim(),
    tel: document.getElementById('rec-tel').value.trim(),
    urgencia: document.getElementById('rec-urg').value,
    hora: new Date().toISOString(), lido:false,
    criadoPorNome: sessaoAtual?.nome||'' };
  try {
    await upsert('RECADOS', row);
    if (recEditandoId) db.recados = db.recados.map(r=>r.id===recEditandoId?row:r);
    else db.recados.push(row);
    await logAcao('Registrou recado', `Para: ${para}`);
    fecharModal('modal-recado');
    toast('Recado salvo ✅','ok'); irAba('recados');
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

async function marcarLido(id) {
  const rec = db.recados.find(r=>r.id===id);
  if (!rec) return;
  const row = {...rec, lido:true};
  try {
    await upsert('RECADOS', row);
    db.recados = db.recados.map(r=>r.id===id?row:r);
    await logAcao('Marcou recado como lido', id);
    toast('Marcado como lido ✅','ok'); irAba('recados');
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

async function excluirRecado(id) {
  if (!confirm('Excluir este recado?')) return;
  try {
    await del('RECADOS', id);
    db.recados = db.recados.filter(r=>r.id!==id);
    toast('Excluído','ok'); irAba('recados');
  } catch(e) { toast('Erro: '+e.message,'err'); }
}

// ══════════════════════════════════════════════════════════
//  UTILITÁRIOS
// ══════════════════════════════════════════════════════════
function podeEditar() {
  if (!sessaoAtual) return false;
  const p = (sessaoAtual.perfil||'').toLowerCase();
  return p === 'administrador' || p.includes('lançador') || p.includes('lancador') || p === 'diretoria';
}

function abrirModal(id) { document.getElementById(id).classList.add('aberto'); }
function fecharModal(id) { document.getElementById(id).classList.remove('aberto'); }

function toggleUserMenu() {
  document.getElementById('user-menu').classList.toggle('aberto');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#topbar-user')) document.getElementById('user-menu').classList.remove('aberto');
});

function toast(msg, tipo='info') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = tipo;
  t.style.display='block';
  clearTimeout(t._t); t._t = setTimeout(()=>t.style.display='none', 3200);
}

function fmtData(val) {
  if (!val) return '—';
  try { return new Date(String(val).slice(0,10)+'T00:00:00').toLocaleDateString('pt-BR'); } catch(e) { return val; }
}

function fmtHora(val) {
  if (!val) return '—';
  try {
    const d = new Date(val);
    if (isNaN(d)) return String(val).slice(0,5);
    return d.toLocaleString('pt-BR');
  } catch(e) { return val; }
}

function fmtStatus(s) {
  return {aguardando:'Aguardando',em_atendimento:'Em atendimento',finalizado:'Finalizado'}[s]||s||'—';
}

// Fechar modal clicando fora
document.querySelectorAll('.modal-bg').forEach(m => {
  m.addEventListener('click', e => { if (e.target===m) fecharModal(m.id); });
});
</script>
